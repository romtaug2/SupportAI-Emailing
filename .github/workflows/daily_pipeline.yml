# ═══════════════════════════════════════════════════════════════
#  SupportAI : Pipeline Quotidien : RÉCOLTE + ENVOI 150/jour
#  Lun-Sam (6j/sem), 1 seul run, temps borné (job 50 min, récolte 18 max) :
#   1. scrape_slice.py  : tranche notaires (300 offices ≈ 10 min,
#      skip auto du déjà-vu, curseur région, mode create = 0 stale)
#   2. build_master.py  : merge exports → master (tracking préservé)
#   3. send_supportai.py: MASS 150 emails (pauses 2-6s ≈ 10 min)
#   4. commit : DB + exports + curseur + master
#   5. alerte : ROUGE si quelque chose est CASSÉ (récolte KO, envoi
#      arrêté alors qu'il restait des contacts, machine totalement à sec)
#      ORANGE (avertissement, run vert) si la réserve est juste maigre
#  Budget Actions ≈ 35 min × 26 j ≈ 910 min/mois.
#  Secret requis : SMTP_PASSWORD
#  ⚠️ Hiver (CET) : décaler le cron de +1h si besoin.
#
#  CORRECTIFS 2026-09-29 :
#   - curl_cffi ajouté aux dépendances : sans lui, scrapers/notaires.py
#     retombe sur requests nu → 403 Cloudflare → 0 notaire depuis mai.
#   - commit : `git add a b c` abandonne TOUT si un chemin n'existe pas
#     (data/scrape_cursor.json n'a jamais existé) → rien n'était commité.
#     On ajoute maintenant chemin par chemin, seulement s'il existe.
#   - étape finale d'alerte : échec volontaire → mail GitHub.
#
#  CORRECTIFS 2026-10-19 :
#   - Volume 300 → 150/jour : la récolte produit ~150 contacts/jour en
#     moyenne. À 300, la réserve se vidait un jour sur deux (run rouge).
#   - Alerte : l'ancien seuil "< 150 envoyés" sonnait dès que la récolte
#     du jour était maigre, sans rien de cassé. Désormais rouge seulement
#     si un vrai problème existe ; une réserve faible = avertissement.
#   - build_master.py réconcilie le master avec suppression.csv : 10 821
#     contacts déjà envoyés étaient affichés "pending" (faux stock).
# ═══════════════════════════════════════════════════════════════

name: "🔁 SupportAI Pipeline Quotidien"

on:
  schedule:
    - cron: "50 5 * * 1-6"   # Lun-Sam 7h50 Paris (été)
  workflow_dispatch:
    inputs:
      daily_limit:
        description: "Emails à envoyer (défaut 150)"
        required: false
        default: "150"
      slice_size:
        description: "Offices notaires à scraper (défaut 300, 0 = skip)"
        required: false
        default: "300"
      dry_run:
        description: "Dry run envoi (construire sans envoyer) ?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: supportai-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Dépendances du scraper notaires uniquement (pas de Playwright ici).
      # curl_cffi est OBLIGATOIRE : notaires.fr est derrière Cloudflare.
      - name: Dépendances (léger)
        run: pip install -q requests beautifulsoup4 lxml openpyxl curl_cffi

      # Plafond dur de 18 min : si Cloudflare ralentit (backoff 10→90 s), la
      # récolte est coupée et l'envoi garde ses 20 min. Les offices déjà
      # flushés en base (lots de 50) sont conservés et sautés au run suivant.
      - name: 1/3 Récolte — tranche notaires
        id: recolte_notaires
        # ⚠️ Sur un run planifié, github.event.inputs est NULL. GitHub convertit
        # null et '0' en nombre 0 → `null != '0'` vaut FALSE → l'étape était
        # SKIPPÉE à chaque cron depuis mai. On teste donc le déclencheur d'abord.
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.slice_size != '0' }}
        timeout-minutes: 18
        env:
          SLICE_SIZE: ${{ github.event.inputs.slice_size || '300' }}
        run: python scrape_slice.py
        continue-on-error: true   # un échec/timeout de récolte ne bloque pas l'envoi (mais fait échouer l'étape finale)

      - name: Rapport récolte (visibilité)
        if: always()
        run: |
          {
            echo "## Récolte notaires"
            if [ "${{ steps.recolte_notaires.outcome }}" = "failure" ]; then
              echo "⚠️ **Récolte notaires en ÉCHEC** (Cloudflare / réseau). L'envoi continue mais la base n'a pas été enrichie."
            else
              echo "✅ Récolte notaires terminée sans erreur."
            fi
            python - <<'PY'
          import sqlite3
          try:
              n = sqlite3.connect("data/notaires.db").execute(
                  "SELECT COUNT(*) FROM notaires").fetchone()[0]
              print(f"- Offices notaires en base : **{n}**")
          except Exception as e:
              print(f"- (compte indisponible : {e})")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 2/3 Master — fusion exports
        run: python emailing/build_master.py

      # Garantit que le registre de suppression existe et contient les
      # plaignants connus AVANT chaque envoi (idempotent, append-only).
      - name: 2.5/3 Seed suppression — plaignants bloqués
        run: python emailing/seed_suppression.py

      - name: 3/3 Envoi — MASS
        env:
          SEND_MODE: "MASS"
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '150' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python emailing/send_supportai.py

      - name: Commit (avec retry anti-conflit)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "SupportAI Bot"
          git config user.email "bot@supportai.fr"

          # Chemin par chemin : un seul chemin manquant faisait tout annuler.
          for p in data/notaires.db \
                   data/scrape_cursor.json \
                   exports/notaires \
                   emailing/data/supportai_contacts_master.csv \
                   emailing/data/suppression.csv \
                   data/reports; do
            if [ -e "$p" ]; then
              git add -A -- "$p"
            else
              echo "ℹ️ absent, ignoré : $p"
            fi
          done

          if git diff --cached --quiet; then
            echo "ℹ️ Rien à committer"
            exit 0
          fi

          git commit -m "🔁 Pipeline $(date -u +%Y-%m-%d) : récolte + envoi"

          for i in 1 2 3; do
            git push origin main && exit 0
            echo "⚠️ Push rejeté, rebase..."
            git pull --rebase --autostash origin main || exit 1
            sleep $((RANDOM % 10 + 3))
          done
          exit 1

      # Toujours en DERNIER : un échec ici ne doit rien empêcher d'autre.
      #  ROUGE (run en échec → mail GitHub) seulement si quelque chose est CASSÉ :
      #   - la récolte notaires a échoué ;
      #   - l'envoi s'est arrêté alors qu'il restait des contacts (SMTP, quota,
      #     timeout...) ;
      #   - zéro envoi ET zéro contact en réserve : machine totalement à sec.
      #  ORANGE (avertissement visible dans le run, pas de mail) si la réserve
      #  ne couvre pas l'envoi de demain : à surveiller, rien de cassé.
      - name: Alerte — panne réelle ou réserve faible
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          RECOLTE_OUTCOME: ${{ steps.recolte_notaires.outcome }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '150' }}
        run: |
          python - <<'PY'
          import csv, os, re, sys
          from datetime import datetime, timezone

          sup = list(csv.DictReader(open("emailing/data/suppression.csv", encoding="utf-8-sig")))
          sup_emails  = {(r.get("email")  or "").strip().lower() for r in sup} - {""}
          sup_domains = {(r.get("domain") or "").strip().lower() for r in sup} - {""}

          # Même règle que _is_risky() dans emailing/send_supportai.py
          RISKY_LOCAL_RE = re.compile(
              r"^(?:privacy\w*|rgpd\w*|dpo|legal\w*|juridique\w*|saisine\w*|mediat\w*|"
              r"relationconso\w*|reclamations?|jobs?|presse?|abuse|postmaster|no-?reply)"
              r"(?:[._+\-]|$)"
          )
          RISKY_DOMAINS = {"exemple.com", "example.com", "fevad.com"}

          def ok(email):
              local, _, dom = email.partition("@")
              if not local or "." not in dom:
                  return False
              if email in sup_emails or dom in sup_domains:
                  return False
              return not (RISKY_LOCAL_RE.match(local) or dom in RISKY_DOMAINS)

          rows = list(csv.DictReader(open("emailing/data/supportai_contacts_master.csv", encoding="utf-8-sig")))
          stock = sum(1 for r in rows
                      if (r.get("send_status") or "").strip().lower() == "pending"
                      and ok((r.get("email") or "").strip().lower()))
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          sent_today = sum(1 for r in rows
                           if (r.get("send_status") or "").strip().lower() == "sent"
                           and (r.get("sent_at") or "").startswith(today))

          limit = int(os.environ.get("DAILY_LIMIT") or 150)
          recolte = os.environ.get("RECOLTE_OUTCOME", "")
          jours = stock / limit if limit else 0

          print(f"Envoyés aujourd'hui  : {sent_today} / {limit}")
          print(f"Réserve restante     : {stock} contacts (≈ {jours:.1f} jour(s) d'envoi)")
          print(f"Récolte notaires     : {recolte or 'n/a'}")

          rouge, orange = [], []
          if recolte == "failure":
              rouge.append("récolte notaires en ÉCHEC (voir étape 1/3)")
          if sent_today < limit and stock > 0:
              rouge.append(f"envoi arrêté à {sent_today}/{limit} alors qu'il restait {stock} contacts "
                           "(voir étape 3/3 : SMTP, quota ou temps)")
          if sent_today == 0 and stock == 0:
              rouge.append("machine à sec : aucun envoi et aucun contact en réserve")
          if not rouge and stock < limit:
              orange.append(f"réserve faible : {stock} contacts pour demain (objectif {limit}). "
                            "Récolte du jour maigre, rien de cassé.")

          etat = "🔴 PANNE" if rouge else ("🟠 À surveiller" if orange else "🟢 OK")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"\n## Envoi du jour : {etat}\n")
              fh.write(f"- Envoyés aujourd'hui : **{sent_today}** / {limit}\n")
              fh.write(f"- Réserve pour les prochains jours : **{stock}** contacts (≈ {jours:.1f} jour(s))\n")
              for m in rouge + orange:
                  fh.write(f"- {m}\n")

          for m in orange:
              print(f"::warning title=Réserve faible::{m}")
          if rouge:
              for m in rouge:
                  print(f"🚨 {m}")
              sys.exit(1)
          print("✅ OK" if not orange else "🟠 OK, réserve à surveiller")
          PY
